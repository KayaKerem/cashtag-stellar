[package]
name = "reclaim-verify"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[features]
# Off-chain helpers for tests in other crates (signing with a local attestor key). Never enabled in wasm builds.
testutils = ["dep:k256", "dep:sha3", "soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { workspace = true }
k256 = { workspace = true, optional = true }
sha3 = { workspace = true, optional = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
k256 = { workspace = true }
sha3 = { workspace = true }
