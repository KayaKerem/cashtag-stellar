name: scout-audit
# Manual only for now: Scout's pinned dylint_driver (4.1.2) currently fails to build upstream
# (`revparse_ext failed for master`), locally and in this action alike. Re-enable on push once fixed.
on:
  workflow_dispatch:

jobs:
  scout:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        contract: [cliprail, humanity, reclaim-verify]
    steps:
      - uses: actions/checkout@v4
      - name: Scout (${{ matrix.contract }})
        uses: coinfabrik/scout-actions@v3
        with:
          target: contracts/${{ matrix.contract }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-${{ matrix.contract }}
          path: ${{ github.workspace }}/report.md
          if-no-files-found: warn
