name: scout-audit
# Manual only for now: Scout's pinned dylint_driver (4.1.2) clones rust-clippy at `master`, which no
# longer exists (`revparse_ext failed for master`). Local runs use a one-line workaround; see security/scout/README.md.
on:
  workflow_dispatch:

jobs:
  scout:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        contract: [cliprail, humanity, reclaim-verify]
    steps:
      - uses: actions/checkout@v4
      - name: Scout (${{ matrix.contract }})
        uses: coinfabrik/scout-actions@v3
        with:
          target: contracts/${{ matrix.contract }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-${{ matrix.contract }}
          path: ${{ github.workspace }}/report.md
          if-no-files-found: warn
