# Hosted off-chain stack (Stellar testnet only): verifier + keeper + Anon Aadhaar prover in one
# service, behind Caddy with automatic TLS. Run from the repo root on the server:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  verifier:
    build:
      context: ..
      dockerfile: services/verifier/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    env_file: verifier.env
    environment:
      PORT: "8787"
      DATA_DIR: /data
      AADHAAR_ARTIFACTS_DIR: /data/aadhaar-artifacts
      KEEPER: "1"
      TRUST_PROXY: "1" # Caddy is the only ingress; it appends the client IP to X-Forwarded-For
    volumes:
      - verifier-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  caddy:
    image: caddy:2.10-alpine
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [verifier]
    restart: unless-stopped

volumes:
  verifier-data:
  caddy-data:
  caddy-config:
